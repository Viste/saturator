name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone VST3 SDK
      run: |
        git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git C:\vst3sdk

    - name: Configure CMake
      run: |
        cmake -B build -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -Dvst3sdk_SOURCE_DIR=C:\vst3sdk

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package VST3 (zip)
      shell: bash
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        echo "Found: $VST3_PATH"
        7z a Saturator-Windows-x64.zip "./$VST3_PATH/*"

    - name: Build Installer (Inno Setup)
      shell: bash
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        VERSION=${GITHUB_REF_NAME#v}
        if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="2.0.0"; fi
        iscc //DAppVersion="$VERSION" //DVst3Source="$(cygpath -w "$VST3_PATH")" \
             //O"." installer/saturator.iss

    - name: Upload artifact (zip)
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-Windows-x64
        path: Saturator-Windows-x64.zip

    - name: Upload artifact (installer)
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-Windows-x64-Setup
        path: Saturator-*-Setup.exe

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone VST3 SDK
      run: |
        git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git /tmp/vst3sdk

    - name: Patch VST3 SDK (threadchecker_mac.mm)
      run: |
        for f in \
          /tmp/vst3sdk/public.sdk/source/common/threadchecker_mac.mm \
          /tmp/vst3sdk/base/thread/source/flock_mac.mm \
          /tmp/vst3sdk/base/thread/source/threadchecker_mac.mm; do
          if [ -f "$f" ] && ! grep -q '#include <exception>' "$f"; then
            sed -i '' '1s/^/#include <exception>\n/' "$f"
          fi
        done

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -Dvst3sdk_SOURCE_DIR=/tmp/vst3sdk

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Package VST3
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        echo "Found: $VST3_PATH"
        ditto -c -k --sequesterRsrc "$VST3_PATH" Saturator-macOS-arm64.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-macOS-arm64
        path: Saturator-macOS-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          Saturator-Windows-x64/Saturator-Windows-x64.zip
          Saturator-Windows-x64-Setup/Saturator-*-Setup.exe
          Saturator-macOS-arm64/Saturator-macOS-arm64.zip
