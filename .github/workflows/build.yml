name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone VST3 SDK
      run: |
        git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git C:\vst3sdk

    - name: Configure CMake
      run: |
        cmake -B build -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -Dvst3sdk_SOURCE_DIR=C:\vst3sdk

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run DSP tests
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        cl.exe /std:c++latest /EHsc /O2 /I source /I extra\q_lib\include /I extra\infra\include tests\param_test.cpp source\dsp\InstrumentMode.cpp source\dsp\DrumMode.cpp source\dsp\VocalMode.cpp source\dsp\MultibandSplitter.cpp /Fe:tests\param_test.exe
        tests\param_test.exe

    - name: Package VST3 (zip)
      shell: bash
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        VST3_PARENT=$(dirname "$VST3_PATH")
        echo "Found: $VST3_PATH"
        cd "$VST3_PARENT" && 7z a "$OLDPWD/Saturator-Windows-x64.zip" "Saturator.vst3"

    - name: Build Installer (Inno Setup)
      shell: bash
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        VERSION=${GITHUB_REF_NAME#v}
        if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="2.2.0"; fi
        iscc //DAppVersion="$VERSION" //DVst3Source="$(cygpath -w "$(pwd)/$VST3_PATH")" \
             //O"." installer/saturator.iss

    - name: Upload artifact (zip)
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-Windows-x64
        path: Saturator-Windows-x64.zip

    - name: Upload artifact (installer)
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-Windows-x64-Setup
        path: Saturator-*-Setup.exe

  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone VST3 SDK
      run: |
        git clone --recursive --depth 1 https://github.com/steinbergmedia/vst3sdk.git /tmp/vst3sdk

    - name: Patch VST3 SDK (threadchecker_mac.mm)
      run: |
        for f in \
          /tmp/vst3sdk/public.sdk/source/common/threadchecker_mac.mm \
          /tmp/vst3sdk/base/thread/source/flock_mac.mm \
          /tmp/vst3sdk/base/thread/source/threadchecker_mac.mm; do
          if [ -f "$f" ] && ! grep -q '#include <exception>' "$f"; then
            sed -i '' '1s/^/#include <exception>\n/' "$f"
          fi
        done

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -Dvst3sdk_SOURCE_DIR=/tmp/vst3sdk

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Run DSP tests
      run: |
        clang++ -std=c++23 -O2 \
          -I source -I extra/q_lib/include -I extra/infra/include \
          tests/param_test.cpp \
          source/dsp/InstrumentMode.cpp \
          source/dsp/DrumMode.cpp \
          source/dsp/VocalMode.cpp \
          source/dsp/MultibandSplitter.cpp \
          -o tests/param_test
        ./tests/param_test

    - name: Package VST3 (zip)
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        VST3_PARENT=$(dirname "$VST3_PATH")
        echo "Found: $VST3_PATH"
        cd "$VST3_PARENT" && ditto -c -k --sequesterRsrc "Saturator.vst3" "$OLDPWD/Saturator-macOS-arm64.zip"

    - name: Build DMG installer
      run: |
        VST3_PATH=$(find build -name "Saturator.vst3" -type d | head -1)
        VERSION=${GITHUB_REF_NAME#v}
        if [[ ! "$VERSION" =~ ^[0-9] ]]; then VERSION="2.2.0"; fi

        # создаём структуру для DMG
        DMG_DIR=$(mktemp -d)
        VST3_DEST="$DMG_DIR/Saturator.vst3"
        ditto "$VST3_PATH" "$VST3_DEST"

        # install script — копирует в ~/Library/Audio/Plug-Ins/VST3
        cat > "$DMG_DIR/Install Saturator.command" << 'SCRIPT'
        #!/bin/bash
        DEST="$HOME/Library/Audio/Plug-Ins/VST3"
        mkdir -p "$DEST"
        SRC="$(dirname "$0")/Saturator.vst3"
        if [ ! -d "$SRC" ]; then
          echo "Ошибка: Saturator.vst3 не найден рядом со скриптом"
          exit 1
        fi
        rm -rf "$DEST/Saturator.vst3"
        cp -R "$SRC" "$DEST/"
        echo ""
        echo "Saturator установлен в $DEST/Saturator.vst3"
        echo "Перезапустите DAW для применения."
        echo ""
        read -p "Нажмите Enter для выхода..."
        SCRIPT
        chmod +x "$DMG_DIR/Install Saturator.command"

        # собираем DMG
        hdiutil create -volname "Saturator $VERSION" \
          -srcfolder "$DMG_DIR" \
          -ov -format UDZO \
          "Saturator-macOS-arm64-$VERSION.dmg"

    - name: Upload artifact (zip)
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-macOS-arm64
        path: Saturator-macOS-arm64.zip

    - name: Upload artifact (dmg)
      uses: actions/upload-artifact@v4
      with:
        name: Saturator-macOS-arm64-DMG
        path: Saturator-macOS-arm64-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          Saturator-Windows-x64/Saturator-Windows-x64.zip
          Saturator-Windows-x64-Setup/Saturator-*-Setup.exe
          Saturator-macOS-arm64/Saturator-macOS-arm64.zip
          Saturator-macOS-arm64-DMG/Saturator-macOS-arm64-*.dmg
